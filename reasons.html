<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>22 Reasons 💗</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="feature-page">


    <a
        href="index.html"
        class="back-button"
    >
        ← Birthday Home
    </a>


    <div class="feature-header">

        <span class="feature-icon">
            💗
        </span>

        <h1>
            22 Little Reasons
        </h1>

        <p>
            Since you're turning 22,
            I thought you deserved 22 little reminders
            of just how special you are.
        </p>

    </div>


    <div class="reason-box">

        <div
            class="reason-number"
            id="reasonNumber"
        >
            Ready?
        </div>


        <div
            class="big-heart"
            id="reasonHeart"
        >
            💗
        </div>


        <h2
            id="reasonText"
        >
            Click below to reveal your first one.
        </h2>


        <button
            onclick="nextReason()"
            class="reason-button"
        >

            Reveal One ❤️

        </button>


        <p
            class="reason-progress"
            id="reasonProgress"
        >
            0 / 22
        </p>

    </div>


</div>


<script src="reasons.js"></script>


</body>

</html>
